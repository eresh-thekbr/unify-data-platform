<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" color="#1b2230" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="SPY bars flow: replay.py reads SPY one-minute bars from MongoDB and produces them to the Kafka topic udp.spy_bars_1m, saving a checkpoint after each acknowledgment; file_writer.py writes durable JSON Lines files and only then commits offsets; upload_bars.py uploads each file once to a Unity Catalog Volume; an Auto Loader serverless job loads them into the bronze Iceberg table, and silver keeps the latest valid bar per minute while invalid rows go to quarantine.">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#f6f7f9"/>

  <!-- Title -->
  <text x="22" y="34" font-size="18" font-weight="bold" fill="#1b2230">SPY market bars: streaming ingestion flow</text>
  <text x="22" y="54" font-size="12" fill="#475569">Every hand-off saves its position only after the next step has the data, so any process can restart without losing bars.</text>

  <!-- Zones -->
  <rect x="12" y="78" width="1176" height="224" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="26" y="96" font-size="11" font-weight="bold" fill="#475569" letter-spacing="1">LOCAL MAC</text>
  <rect x="12" y="338" width="1176" height="266" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="26" y="595" font-size="11" font-weight="bold" fill="#475569" letter-spacing="1">DATABRICKS FREE EDITION <tspan font-weight="normal" letter-spacing="0">· Unity Catalog <tspan font-family="Menlo, Consolas, monospace">workspace.uc1_spy_bars</tspan> · managed Iceberg</tspan></text>

  <!-- Row 1 column headers -->
  <g font-size="10.5" font-weight="bold" fill="#64748b" letter-spacing="1" text-anchor="middle">
    <text x="100" y="114">SOURCE</text>
    <text x="300" y="114">PRODUCER</text>
    <text x="500" y="114">BROKER</text>
    <text x="700" y="114">CONSUMER</text>
    <text x="900" y="114">LANDING</text>
    <text x="1100" y="114">UPLOADER</text>
  </g>

  <!-- Row 1 boxes -->
  <rect x="22" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="100" y="143" text-anchor="middle" font-size="12" font-weight="bold">MongoDB</text>
  <text x="100" y="161" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#334155">unified_trader.bars_1m</text>
  <text x="100" y="178" text-anchor="middle" font-size="10.5" fill="#475569">SPY only, read-only</text>
  <text x="100" y="194" text-anchor="middle" font-size="10.5" fill="#475569">ordered by ts</text>

  <rect x="222" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="300" y="143" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">replay.py</text>
  <text x="300" y="161" text-anchor="middle" font-size="10.5" fill="#334155">idempotent producer</text>
  <text x="300" y="178" text-anchor="middle" font-size="10.5" fill="#475569">1 bar every 5 s</text>
  <text x="300" y="194" text-anchor="middle" font-size="10.5" fill="#475569">key = symbol</text>

  <rect x="422" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="500" y="143" text-anchor="middle" font-size="12" font-weight="bold">Kafka</text>
  <text x="500" y="161" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">udp.spy_bars_1m</text>
  <text x="500" y="178" text-anchor="middle" font-size="10.5" fill="#475569">JSON messages</text>

  <rect x="622" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="700" y="143" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">file_writer.py</text>
  <text x="700" y="161" text-anchor="middle" font-size="10.5" fill="#334155">10 bars or 30 s</text>
  <text x="700" y="178" text-anchor="middle" font-size="10.5" fill="#0f766e">fsync → rename</text>
  <text x="700" y="194" text-anchor="middle" font-size="10.5" fill="#0f766e">then commit offsets</text>

  <rect x="822" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="900" y="143" text-anchor="middle" font-size="12" font-weight="bold">Landing files</text>
  <text x="900" y="161" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#334155">landing/spy_bars_1m/</text>
  <text x="900" y="178" text-anchor="middle" font-size="10.5" fill="#475569">complete *.jsonl only</text>
  <text x="900" y="194" text-anchor="middle" font-size="10.5" fill="#475569">never overwritten</text>

  <rect x="1022" y="122" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1100" y="143" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">upload_bars.py</text>
  <text x="1100" y="161" text-anchor="middle" font-size="10.5" fill="#334155">polls every 30 s</text>
  <text x="1100" y="178" text-anchor="middle" font-size="10.5" fill="#475569">SHA-256 checked</text>
  <text x="1100" y="194" text-anchor="middle" font-size="10.5" fill="#475569">overwrite=False</text>

  <!-- Row 1 main arrows -->
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <line x1="178" y1="160" x2="220" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="378" y1="160" x2="420" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="578" y1="160" x2="620" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="778" y1="160" x2="820" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="978" y1="160" x2="1020" y2="160" marker-end="url(#arrow-blue)"/>
  </g>
  <g font-size="10" fill="#2563eb" text-anchor="middle">
    <text x="200" y="152">read</text>
    <text x="400" y="152">produce</text>
    <text x="600" y="152">poll</text>
    <text x="800" y="152">write</text>
    <text x="1000" y="152">read</text>
  </g>

  <!-- Row 1 feedback: ack and offset commit -->
  <g stroke="#7c3aed" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <line x1="422" y1="198" x2="380" y2="198" marker-end="url(#arrow-purple)"/>
    <line x1="622" y1="198" x2="580" y2="198" marker-end="url(#arrow-purple)"/>
  </g>
  <g font-size="10" fill="#7c3aed" text-anchor="middle">
    <text x="400" y="212">ack</text>
    <text x="600" y="212">commit</text>
  </g>

  <!-- Local state stores -->
  <path d="M300,212 L300,240" stroke="#7c3aed" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-purple)">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="222" y="242" width="156" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="300" y="261" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1b2230">.state/spy-bars.json</text>
  <text x="300" y="278" text-anchor="middle" font-size="10" fill="#7c3aed">saved after each ack</text>

  <path d="M1071,212 L1071,240" stroke="#7c3aed" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-purple)">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="1022" y="242" width="104" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1074" y="261" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1b2230">uploads.sqlite3</text>
  <text x="1074" y="278" text-anchor="middle" font-size="10" fill="#7c3aed">skip uploaded</text>

  <!-- Upload connector across zones -->
  <path d="M1150,212 L1150,320 L300,320 L300,378" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="560" y="309" width="300" height="20" rx="4" fill="#f6f7f9"/>
  <text x="710" y="323" text-anchor="middle" font-size="10.5" fill="#2563eb">upload over HTTPS (Databricks Files API)</text>

  <!-- Row 2 column headers -->
  <g font-size="10.5" font-weight="bold" fill="#64748b" letter-spacing="1" text-anchor="middle">
    <text x="582" y="374">BRONZE</text>
    <text x="892" y="374">SILVER</text>
  </g>

  <!-- Row 2 boxes -->
  <rect x="222" y="380" width="156" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="300" y="403" text-anchor="middle" font-size="12" font-weight="bold">UC Volume</text>
  <text x="300" y="421" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">spy_bars_landing</text>
  <text x="300" y="438" text-anchor="middle" font-size="10.5" fill="#475569">JSON Lines files</text>

  <rect x="470" y="380" width="224" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="582" y="403" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">bronze_spy_bars_1m</text>
  <text x="582" y="421" text-anchor="middle" font-size="10.5" fill="#334155">explicit schema, append only</text>
  <text x="582" y="438" text-anchor="middle" font-size="10.5" fill="#475569">+ source_file_name,</text>
  <text x="582" y="454" text-anchor="middle" font-size="10.5" fill="#475569">ingestion_timestamp</text>

  <rect x="790" y="380" width="204" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="892" y="403" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace">silver_spy_bars_1m</text>
  <text x="892" y="421" text-anchor="middle" font-size="10.5" fill="#334155">latest copy per symbol + ts</text>
  <text x="892" y="438" text-anchor="middle" font-size="10.5" fill="#475569">OHLC, volume and</text>
  <text x="892" y="454" text-anchor="middle" font-size="10.5" fill="#475569">market-hours rules</text>

  <rect x="790" y="505" width="204" height="66" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="892" y="525" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace">quarantine_spy_bars_1m</text>
  <text x="892" y="542" text-anchor="middle" font-size="10.5" fill="#dc2626">every failed rule listed</text>
  <text x="892" y="558" text-anchor="middle" font-size="10.5" fill="#475569">snapshot replaced each run</text>

  <!-- Auto Loader checkpoint -->
  <path d="M582,470 L582,503" stroke="#7c3aed" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-purple)">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="470" y="505" width="224" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="582" y="524" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#1b2230">spy_bars_checkpoints</text>
  <text x="582" y="541" text-anchor="middle" font-size="10" fill="#7c3aed">files already ingested</text>

  <!-- Row 2 arrows -->
  <line x1="378" y1="425" x2="468" y2="425" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="423" y="412" text-anchor="middle" font-size="10" fill="#2563eb">Auto Loader</text>
  <text x="423" y="442" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#475569">availableNow</text>
  <line x1="694" y1="425" x2="788" y2="425" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="741" y="412" text-anchor="middle" font-size="10" fill="#2563eb">MERGE</text>
  <text x="741" y="442" text-anchor="middle" font-size="10" fill="#475569">valid, latest</text>
  <path d="M694,458 L742,458 L742,538 L788,538" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)"/>
  <text x="736" y="500" text-anchor="end" font-size="10" fill="#dc2626">invalid</text>

  <!-- Job note -->
  <text x="1010" y="403" font-size="10.5" font-weight="bold" fill="#475569">Serverless job</text>
  <text x="1010" y="420" font-size="10" fill="#475569">submitted by</text>
  <text x="1010" y="436" font-size="10" font-family="Menlo, Consolas, monospace" fill="#334155">run_bronze.py</text>
  <text x="1010" y="456" font-size="10" fill="#475569">task 1: load_bronze</text>
  <text x="1010" y="472" font-size="10" fill="#475569">task 2: load_silver</text>
  <text x="1010" y="488" font-size="10" fill="#475569">(runs after task 1)</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#475569">
    <text x="30" y="508" font-weight="bold" fill="#64748b" letter-spacing="1">LEGEND</text>
    <circle cx="38" cy="526" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="530">SPY one-minute bar</text>
    <circle cx="38" cy="546" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="550">bar that fails a rule</text>
    <rect x="33" y="561" width="10" height="10" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="570">ack, commit or checkpoint</text>
  </g>

  <g id="moving-events">
    <!-- Valid bars: MongoDB to silver -->
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="6.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="6.6s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L892,425" dur="10s" begin="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="8.2s" repeatCount="indefinite"/></circle>
    <!-- Invalid bar: lands in quarantine -->
    <circle r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M100,160 L1150,160 L1150,320 L300,320 L300,425 L582,425 L694,458 L742,458 L742,538 L892,538" dur="10s" begin="4.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.97;1;1" dur="10s" begin="4.1s" repeatCount="indefinite"/></circle>
    <!-- Ack to producer, then checkpoint saved -->
    <rect x="-4" y="-4" width="8" height="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M500,198 L300,198 L300,262" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.9;1;1" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect>
    <!-- Offset commit after the file is durable -->
    <rect x="-4" y="-4" width="8" height="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M700,198 L500,198" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.9;1;1" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
