<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="530" viewBox="0 0 1220 530" color="#1b2230" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="CardPulse batch flow: a generated 1,000-row card transactions CSV is uploaded to a Unity Catalog Volume, loaded as-is into the bronze Iceberg table, then split into 974 clean silver rows and 26 rejected rows with reasons; gold rebuilds daily spend by category from silver, and pipeline_run_audit records rows read, loaded and rejected, skipping files that already succeeded.">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="1220" height="530" fill="#f6f7f9"/>

  <!-- Title -->
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#1b2230">CardPulse: batch medallion flow</text>
  <text x="30" y="54" font-size="12" fill="#475569">One daily CSV per run. Every bronze row lands in silver or rejected, and the audit row proves it.</text>

  <!-- Databricks boundary -->
  <rect x="470" y="80" width="740" height="430" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="482" y="74" font-size="11" fill="#475569">Serverless job <tspan font-family="Menlo, Consolas, monospace">run_pipeline.py</tspan> · Unity Catalog <tspan font-family="Menlo, Consolas, monospace">workspace.cardpulse</tspan> · every table <tspan font-family="Menlo, Consolas, monospace">USING ICEBERG</tspan></text>

  <!-- Column headers -->
  <g font-size="10.5" font-weight="bold" fill="#64748b" letter-spacing="1">
    <text x="115" y="108" text-anchor="middle">SOURCE</text>
    <text x="345" y="108" text-anchor="middle">LANDING</text>
    <text x="585" y="108" text-anchor="middle">BRONZE</text>
    <text x="840" y="108" text-anchor="middle">SILVER</text>
    <text x="1095" y="108" text-anchor="middle">GOLD</text>
    <text x="490" y="412" font-size="10.5">AUDIT</text>
  </g>

  <!-- Source -->
  <rect x="30" y="120" width="170" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="141" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b2230">generate_transactions.py</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#334155">1,000-row daily CSV</text>
  <text x="115" y="177" text-anchor="middle" font-size="10.5" fill="#dc2626">dup 10 · negative 8</text>
  <text x="115" y="193" text-anchor="middle" font-size="10.5" fill="#dc2626">no card 6 · bad ts 2</text>

  <!-- Landing Volume -->
  <rect x="260" y="120" width="170" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="345" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2230">UC Volume</text>
  <text x="345" y="163" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">/Volumes/workspace/</text>
  <text x="345" y="179" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">cardpulse/landing/</text>

  <!-- Bronze -->
  <rect x="490" y="120" width="190" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="585" y="143" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b2230">bronze_card_transactions</text>
  <text x="585" y="163" text-anchor="middle" font-size="11" fill="#334155">all columns STRING, as-is</text>
  <text x="585" y="180" text-anchor="middle" font-size="10.5" fill="#475569">+ source_file, load_ts, run_id</text>
  <text x="585" y="197" text-anchor="middle" font-size="10.5" fill="#475569">1,000 rows</text>

  <!-- Silver -->
  <rect x="740" y="120" width="200" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="840" y="143" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b2230">silver_card_transactions</text>
  <text x="840" y="163" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">************1234</text>
  <text x="840" y="180" text-anchor="middle" font-size="10.5" fill="#475569">UTC timestamps, deduped</text>
  <text x="840" y="197" text-anchor="middle" font-size="10.5" fill="#2563eb">974 rows</text>

  <!-- Rejected -->
  <rect x="740" y="270" width="200" height="80" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="840" y="292" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1b2230">silver_rejected_transactions</text>
  <text x="840" y="311" text-anchor="middle" font-size="10.5" fill="#475569"><tspan font-family="Menlo, Consolas, monospace">reject_reason</tspan> per failed rule</text>
  <text x="840" y="328" text-anchor="middle" font-size="10.5" fill="#dc2626">26 rows, card still masked</text>

  <!-- Gold -->
  <rect x="1000" y="120" width="190" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1095" y="143" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#1b2230">gold_daily_spend_by_category</text>
  <text x="1095" y="163" text-anchor="middle" font-size="11" fill="#334155">count · total · average</text>
  <text x="1095" y="180" text-anchor="middle" font-size="10.5" fill="#475569">per day and category</text>
  <text x="1095" y="197" text-anchor="middle" font-size="10.5" fill="#475569">rebuilt from silver each run</text>

  <!-- Audit -->
  <rect x="490" y="420" width="430" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="705" y="442" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#1b2230">pipeline_run_audit</text>
  <text x="705" y="460" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#7c3aed">rows_read = rows_loaded + rows_rejected</text>
  <text x="705" y="477" text-anchor="middle" font-size="10.5" fill="#475569">true → SUCCEEDED · otherwise FAILED and the job raises</text>

  <!-- Main path arrows -->
  <g fill="none" stroke="#475569" stroke-width="1.6">
    <line x1="200" y1="165" x2="258" y2="165" marker-end="url(#arrow-dark)"/>
    <line x1="430" y1="165" x2="488" y2="165" marker-end="url(#arrow-dark)"/>
    <line x1="680" y1="165" x2="738" y2="165" stroke="#2563eb" marker-end="url(#arrow-dark)"/>
    <line x1="940" y1="165" x2="998" y2="165" marker-end="url(#arrow-dark)"/>
  </g>
  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <text x="230" y="156" font-family="Menlo, Consolas, monospace">fs cp</text>
    <text x="459" y="156">read</text>
    <text x="710" y="156" fill="#2563eb">valid</text>
    <text x="970" y="156">aggregate</text>
  </g>

  <!-- Rejected branch -->
  <path d="M585,210 L585,310 L738,310" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="665" y="302" text-anchor="middle" font-size="10.5" fill="#dc2626">invalid or duplicate</text>

  <!-- Key mechanism: the split -->
  <rect x="596" y="226" width="134" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="663" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f766e">7 rules, then dedup</text>
  <text x="663" y="257" text-anchor="middle" font-size="10" fill="#0f766e">by transaction_id</text>

  <!-- Counts into audit -->
  <g fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="545" y1="210" x2="545" y2="418" marker-end="url(#arrow-purple)"/>
    <line x1="840" y1="350" x2="840" y2="418" marker-end="url(#arrow-purple)"/>
    <path d="M940,195 L970,195 L970,455 L922,455" marker-end="url(#arrow-purple)"/>
  </g>
  <g font-size="10.5" fill="#7c3aed" font-family="Menlo, Consolas, monospace">
    <text x="537" y="390" text-anchor="end">rows_read</text>
    <text x="848" y="392">rows_rejected</text>
    <text x="978" y="330">rows_loaded</text>
  </g>

  <!-- Guard loop: skip files already loaded -->
  <path id="guard-loop" d="M490,475 L459,475 L459,176" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-purple)">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="292" text-anchor="end" font-size="10.5" fill="#7c3aed">skip the file if the audit</text>
  <text x="450" y="307" text-anchor="end" font-size="10.5" fill="#7c3aed">already has it SUCCEEDED</text>

  <!-- Legend -->
  <g font-size="10.5" fill="#475569">
    <text x="30" y="404" font-weight="bold" fill="#64748b" letter-spacing="1">LEGEND</text>
    <circle cx="38" cy="422" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="426">clean transaction (974 of 1,000)</text>
    <circle cx="38" cy="442" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="446">rejected row (26 of 1,000)</text>
    <rect x="33" y="457" width="10" height="10" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <text x="50" y="466">row count written to the audit</text>
  </g>

  <g id="moving-events">
    <!-- Clean rows: CSV to gold -->
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="0.75s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="3.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="3.75s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L840,165 L1095,165" dur="6s" begin="5.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="5.25s" repeatCount="indefinite"/></circle>
    <!-- Rejected rows: CSV to silver_rejected_transactions -->
    <circle r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M115,165 L345,165 L585,165 L585,310 L840,310" dur="6s" begin="2.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="6s" begin="2.25s" repeatCount="indefinite"/></circle>
    <!-- Audit counts -->
    <rect x="-4" y="-4" width="8" height="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M545,210 L545,455 L600,455" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="5s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M940,195 L970,195 L970,455 L860,455" dur="5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="5s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5" opacity="0"><animateMotion path="M840,350 L840,455 L760,455" dur="5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.95;1;1" dur="5s" begin="4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
